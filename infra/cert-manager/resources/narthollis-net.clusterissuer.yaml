apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: narthollis-net-dns-01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: narthollis-net-dns-01-account-key
    solvers:
    - selector:
        dnsZones:
        - "narthollis.net"
      dns01:
        route53:
          region: us-east-1
          hostedZoneID: "Z05213652UGK6R57H7E1Z"
          accessKeyIDSecretRef:
            name: narthollis-net-route53-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: narthollis-net-route53-credentials
            key: secret-access-key
