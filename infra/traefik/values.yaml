# yaml-language-server: $schema=values.schema.json
traefik:
  ports:
    websecure:
      http3:
        enabled: true
        advertisedPort: 443
    plex:
      port: 32400
      expose:
        default: true
      exposedPort: 32400
      protocol: TCP

  providers:
    kubernetesCRD:
      enabled: true
    kubernetesGateway:
      enabled: true
      experimentalChannel: true
    kubernetesIngress:
      enabled: false

  ingressRoute:
    dashboard:
      enabled: true

  gateway:
    enabled: false

  # logs:
  #   general:
  #     level: TRACE
  #   access:
  #     enabled: true

  service:
    labels:
      bgp: blue
    spec:
      externalTrafficPolicy: Local
      ipFamilyPolicy: RequireDualStack

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  resources:
    requests:
      cpu: 100m
      memory: 250Mi
    limits:
      cpu: 250m
      memory: 250Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80


