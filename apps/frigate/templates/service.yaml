apiVersion: v1
kind: Service
metadata:
  name: frigate-lb
  namespace: {{ .Release.Namespace }}
  labels:
    bgp: blue
  annotations:
    io.cilium/lb-ipam-ips: "192.168.175.4"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: RequireDualStack
  selector:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https-auth
      protocol: TCP
      port: 443
      targetPort: 8971
    - name: http-internal
      protocol: TCP
      port: 5000
      targetPort: 5000
    - name: rtsp
      protocol: TCP
      port: 8554
      targetPort: 8554
    - name: webrtc-tcp
      protocol: TCP
      port: 8555
      targetPort: 8555
    - name: webrtc-udp
      protocol: UDP
      port: 8555
      targetPort: 8555
