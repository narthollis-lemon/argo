frigate:
  image:
    repository: ghcr.io/blakeblackshear/frigate
    tag: 0.18.2

  strategyType: Recreate
  shmSize: 1Gi

  tmpfs:
    enabled: true
    sizeLimit: 1Gi

  env:
    TZ: "Australia/Adelaide"

  envFromSecrets:
  - frigate-secrets

  resources:
    requests:
      cpu: 240m
      memory: 2Gi
      gpu.intel.com/i915: 1
    limits:
      memory: 4Gi
      gpu.intel.com/i915: 1

  persistence:
    config:
      enabled: true
      storageClass: "fast-block"
      accessMode: ReadWriteOnce
      size: 5Gi
      ephemeralWritableConfigYaml: true
    media:
      enabled: true
      storageClass: "slow-block"
      accessMode: ReadWriteOnce
      size: 200Gi

  service:
    type: ClusterIP
    port: 5000

  extraVolumes:
  - name: tls-cert
    secret:
      secretName: cameras-moya-lemon-narthollis-net-tls
      items:
      - key: tls.crt
        path: fullchain.pem
      - key: tls.key
        path: privkey.pem

  extraVolumeMounts:
  - name: tls-cert
    mountPath: /etc/letsencrypt/live/frigate
    readOnly: true

  config: |
    mqtt:
      host: home.lemon.steicke.me
      port: 1883
      user: frigate
      password: '{FRIGATE_MQTT_PASSWORD}'

    go2rtc:
      webrtc:
        candidates:
          - 192.168.175.4:8555
          - stun:8555
      streams:
        garage:
          - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@192.168.174.49:554/

    ffmpeg:
      hwaccel_args: preset-vaapi
      
    detectors:
      ov:
        type: openvino
        device: GPU

    cameras:
      garage:
        enabled: true
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@192.168.174.49:554/
              roles:
                - detect
        detect:
          width: 1280
          height: 720
          enabled: true
        live:
          streams:
            Stream 1: garage
        objects:
          track:
            - person
            - car
        lpr:
          enabled: true
        record:
          enabled: true
          motion:
            days: 7

    lpr:
      enabled: true
