apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: net-narthollis-www-letsencrypt
  namespace: SET_BY_ARGO
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-issuer
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: net-narthollis-www
